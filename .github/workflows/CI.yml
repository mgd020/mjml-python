name: CI

on:
  pull_request:
  release:
    types: [published]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: |
        set -euo pipefail
        python3 -m venv env
        source env/bin/activate
        pip install -r requirements.txt
        maturin develop
        python -m unittest
  
  build_wheels:
    needs: [ tests ]
    # if: >
    #   github.event_name != 'pull_request' || matrix.name == 'linux-manylinux'
    strategy:
      fail-fast: true
      matrix:
        include:
          # x86_64 host, manylinux
          - name: linux-x86-manylinux
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            env:
              CIBW_BUILD: "cp312-manylinux_*"
              CIBW_ARCHS_LINUX: "x86_64"
              CIBW_MANYLINUX_X86_64: "manylinux_2_28"

          # x86_64 host, musllinux
          - name: linux-x86-musllinux
            os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
            env:
              CIBW_BUILD: "cp312-musllinux_*"
              CIBW_ARCHS_LINUX: "x86_64"
              CIBW_MANYLINUX_X86_64: "musllinux_1_2"

          # Arm64 host, manylinux
          - name: linux-arm-manylinux
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            env:
              CIBW_BUILD: "cp312-manylinux_*"
              CIBW_ARCHS_LINUX: "aarch64"
              CIBW_MANYLINUX_AARCH64: "manylinux_2_28"

          # Arm64 host, musllinux
          - name: linux-arm-musllinux
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
            env:
              CIBW_BUILD: "cp312-musllinux_*"
              CIBW_ARCHS_LINUX: "aarch64"
              CIBW_MANYLINUX_AARCH64: "musllinux_1_2"

          # MacOS
          - name: macos
            os: macos-latest
            targets: x86_64-apple-darwin,aarch64-apple-darwin
            env:
              CIBW_ARCHS_MACOS: "x86_64 arm64"

          # Windows
          - name: windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            env:
              CIBW_ARCHS_WINDOWS: "AMD64"

    runs-on: ${{ matrix.os }}
    env:
      CIBW_BUILD: "cp312-*"
      CIBW_SKIP: "pp* *-win32 *_i686"
      CIBW_TEST_COMMAND: "python -m unittest discover -s {project}/tests -t {project} -v"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels (${{ matrix.name }})
        uses: pypa/cibuildwheel@v2.21.3
        env: ${{ matrix.env }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          retention-days: 1
  
  publish_testpypi:
    name: Publish to test.pypi.org
    runs-on: ubuntu-latest
    # if: >
    #   github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == true
    needs: [ build_wheels ]
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  
  publish_pypi:
    name: Publish to pypi.org
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false
    needs: [ build_wheels ]
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
