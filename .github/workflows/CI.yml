name: CI

on:
  pull_request:
  release:
    types: [published]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: |
        set -euo pipefail
        python3 -m venv env
        source env/bin/activate
        pip install -r requirements.txt
        maturin develop
        python -m unittest
  
  build_wheels:
    needs: [ tests ]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-manylinux
            os: ubuntu-latest
            env:
              CIBW_ARCHS_LINUX: "x86_64 aarch64"
              CIBW_MANYLINUX_X86_64: "manylinux_2_28"
              CIBW_MANYLINUX_AARCH64: "manylinux_2_28"
          - name: linux-musllinux
            os: ubuntu-latest
            env:
              CIBW_ARCHS_LINUX: "x86_64 aarch64"
              CIBW_MANYLINUX_X86_64: "musllinux_1_2"
              CIBW_MANYLINUX_AARCH64: "musllinux_1_2"
          - name: macos
            os: macos-latest
            env:
              CIBW_ARCHS_MACOS: "x86_64 arm64"
          - name: windows
            os: windows-latest
            env:
              CIBW_ARCHS_WINDOWS: "AMD64"
    runs-on: ${{ matrix.os }}
    env:
      CIBW_TEST_COMMAND: "python -m unittest discover -s tests -v"
      # Skip interpreters you don't want
      CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_i686"
      # Ensure maturin gets Rust available inside build envs
      CIBW_BEFORE_ALL_LINUX: >
        curl https://sh.rustup.rs -sSf | sh -s -- -y &&
        echo 'source $HOME/.cargo/env' >> $BASH_ENV
      CIBW_BEFORE_ALL_MACOS: >
        curl https://sh.rustup.rs -sSf | sh -s -- -y &&
        echo 'source $HOME/.cargo/env' >> $GITHUB_ENV
      CIBW_BEFORE_ALL_WINDOWS: >
        powershell -Command "irm https://win.rustup.rs -UseBasicParsing | iex; rustup-init -y"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels (${{ matrix.name }})
        uses: pypa/cibuildwheel@v2.21.3
        env: ${{ matrix.env }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          retention-days: 1
  
  publish_testpypi:
    name: Publish to test.pypi.org
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == true
    needs: [ build_wheels ]
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  
  publish_pypi:
    name: Publish to pypi.org
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false
    needs: [ build_wheels ]
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
