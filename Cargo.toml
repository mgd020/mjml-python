[package]
name = "mjml-python"
version = "1.4.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "mjml"
crate-type = ["cdylib"]

[dependencies]
mrml = { version = "6.0.0" }
pyo3 = { version = "~0.29.0", features = ["abi3-py38", "extension-module"] }
