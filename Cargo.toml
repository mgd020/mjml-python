[package]
name = "mjml-python"
version = "1.4.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "mjml"
crate-type = ["cdylib"]

[dependencies]
mrml = "5.0.0"
pyo3 = { version = "0.28.2", features = ["abi3-py38", "extension-module"] }
